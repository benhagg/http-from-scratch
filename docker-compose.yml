services:
  dns:
    build: .
    command: ./dns
    networks:
      net:
        ipv4_address: 172.28.0.12

  server:
    build: .
    command: ./server
    depends_on:
      - dns
    networks:
      net:
        ipv4_address: 172.28.0.10

  client:
    build: .
    command: ./client
    environment:
      DNS_SERVER_IP: "172.28.0.12"
    depends_on:
      - server
      - dns
    networks:
      net:
        ipv4_address: 172.28.0.11

networks:
  net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
