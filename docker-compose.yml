services:
  server:
    build: .
    command: ./server
    networks:
      net:
        ipv4_address: 172.28.0.10

  client:
    build: .
    command: ./client
    depends_on:
      - server
    networks:
      net:
        ipv4_address: 172.28.0.11

networks:
  net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
